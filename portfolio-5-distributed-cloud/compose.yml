# Wavers University — Portfolio 5: a primary and a streaming replica
#
#   docker compose -f portfolio-5-distributed-cloud/compose.yml up -d --wait
#   docker compose -f portfolio-5-distributed-cloud/compose.yml down -v
#
# Separate from the main compose.yml, so Portfolios 1-4 are unaffected.
# Both servers use PostgreSQL's default replication settings
# (wal_level = replica, hot_standby = on). The passwords are for this local
# setup only, and no port is published.
name: wavers-p5

services:
  primary:
    image: postgres:18.6
    container_name: wu-p5-primary
    environment:
      POSTGRES_USER: wavers
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-wavers_local_only}
      POSTGRES_DB: wavers
      REPLICATION_PASSWORD: ${REPLICATION_PASSWORD:-replication_local_only}
    volumes:
      - primary-data:/var/lib/postgresql
      # runs once, when the data directory is first created
      - ./Olayinka_Egbedokun_primary_init.sh:/docker-entrypoint-initdb.d/replication.sh:ro
    healthcheck:
      # over TCP, so it is healthy only once the real server (not the
      # image's temporary set-up server) accepts connections
      test: ["CMD-SHELL", "pg_isready -h 127.0.0.1 -U wavers -d wavers"]
      interval: 2s
      timeout: 3s
      retries: 30

  replica:
    image: postgres:18.6
    container_name: wu-p5-replica
    user: postgres
    entrypoint: ["bash", "/replica_start.sh"]
    environment:
      REPLICATION_PASSWORD: ${REPLICATION_PASSWORD:-replication_local_only}
    volumes:
      - replica-data:/var/lib/postgresql
      - ./Olayinka_Egbedokun_replica_start.sh:/replica_start.sh:ro
    depends_on:
      primary:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -h 127.0.0.1 -U wavers -d wavers"]
      interval: 2s
      timeout: 3s
      retries: 30

volumes:
  primary-data:
  replica-data:
