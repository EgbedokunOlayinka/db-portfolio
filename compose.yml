# Wavers University Student Result Portal — local database services
#
#   docker compose up -d --wait     start PostgreSQL and wait until it is healthy
#   docker compose down             stop (data is kept in the named volume)
#   docker compose down -v          stop and delete the data
#
# The image is pinned to an exact release so every run uses the same server.
# The password is for this local, single-user setup only. No port is
# published: every script reaches the server with `docker exec`.
name: wavers-portal

services:
  postgres:
    image: postgres:18.6
    container_name: wu-postgres
    environment:
      POSTGRES_USER: wavers
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-wavers_local_only}
      POSTGRES_DB: wavers
    volumes:
      # From PostgreSQL 18 the image keeps its data under /var/lib/postgresql/18/,
      # so the volume is mounted one level up, at /var/lib/postgresql.
      - pgdata:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U wavers -d wavers"]
      interval: 2s
      timeout: 3s
      retries: 30

volumes:
  pgdata:
