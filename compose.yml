# Wavers University Student Result Portal — local database services
#
#   docker compose up -d --wait     start PostgreSQL and MongoDB and wait until both are healthy
#   docker compose down             stop (data is kept in the named volume)
#   docker compose down -v          stop and delete the data
#
# Images are pinned to exact releases so every run uses the same servers.
# The passwords are for this local, single-user setup only. No port is
# published: every script reaches the servers with `docker exec`.
name: wavers-portal

services:
  postgres:
    image: postgres:18.6
    container_name: wu-postgres
    environment:
      POSTGRES_USER: wavers
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-wavers_local_only}
      POSTGRES_DB: wavers
    volumes:
      # From PostgreSQL 18 the image keeps its data under /var/lib/postgresql/18/,
      # so the volume is mounted one level up, at /var/lib/postgresql.
      - pgdata:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U wavers -d wavers"]
      interval: 2s
      timeout: 3s
      retries: 30

  mongo:
    image: mongo:8.0.34
    container_name: wu-mongo
    environment:
      MONGO_INITDB_ROOT_USERNAME: wavers
      MONGO_INITDB_ROOT_PASSWORD: ${MONGO_PASSWORD:-wavers_local_only}
    volumes:
      - mongodata:/data/db
    healthcheck:
      test: ["CMD", "mongosh", "--quiet", "--eval", "db.adminCommand('ping').ok"]
      interval: 2s
      timeout: 5s
      retries: 30

volumes:
  pgdata:
  mongodata:
